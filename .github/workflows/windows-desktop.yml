name: Windows desktop regression

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'Assets/Brand/barrette.svg'
      - 'Assets/Editorial/river.jpg'
      - '.github/workflows/windows-desktop.yml'
      - '.github/scripts/install-test-ocr.ps1'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese, Korean and Russian OCR on the test machine
        shell: pwsh
        run: ./.github/scripts/install-test-ocr.ps1
      - name: Install Windows development build
        run: .\windows\setup.cmd
      - name: Build and unpack the portable app
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe windows\package.py dist\WaxTranslate-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP '便携测试 Windows x64'
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path dist\WaxTranslate-Windows-x64.zip), $target)
          "PORTABLE_APP=$target\WaxTranslate" >> $env:GITHUB_ENV
      - name: Verify the actual launcher and repeat activation
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'new profile'
          & "$env:PORTABLE_APP\runtime\python.exe" windows\check_launcher.py "$env:PORTABLE_APP"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test packaged desktop at 100% and 150% Qt scale
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'new profile'
          & "$env:PORTABLE_APP/runtime/python.exe" -c "from winrt.windows.media.ocr import OcrEngine; tags = {l.language_tag.split('-')[0] for l in OcrEngine.available_recognizer_languages}; print('Installed OCR:', sorted(tags)); assert {'ja', 'ko', 'ru'} <= tags"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($scale in '1', '1.5') {
            Write-Host "QT_SCALE_FACTOR=$scale"
            $env:QT_SCALE_FACTOR = $scale
            & "$env:PORTABLE_APP\runtime\python.exe" windows\check.py --desktop -v
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WaxTranslate-Windows-x64
          path: dist/WaxTranslate-Windows-x64.zip
          compression-level: 0
