name: Windows desktop regression

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/sentence-boundaries.json'
      - 'Assets/Brand/barrette.svg'
      - 'Assets/Editorial/glance.png'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Windows development build
        run: .\windows\setup.cmd
      - name: Build and unpack the portable app
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe windows\package.py dist\WaxTranslate-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP '便携测试 Windows x64'
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path dist\WaxTranslate-Windows-x64.zip), $target)
          "PORTABLE_APP=$target\WaxTranslate" >> $env:GITHUB_ENV
      - name: Verify the actual launcher and repeat activation
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'new profile'
          & "$env:PORTABLE_APP\runtime\python.exe" windows\check_launcher.py "$env:PORTABLE_APP"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify default languages and download optional packs in a fresh profile
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'new profile'
          $python = "$env:PORTABLE_APP\runtime\python.exe"
          & $python -c "import install_model as m; assert {c for c in m.MODELS if m.language_ready(c)} == set(m.DEFAULT_LANGUAGES)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python "$env:PORTABLE_APP\windows\install_model.py" --all-languages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -c "import install_model as m; assert all(m.language_ready(c) for c in m.MODELS)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test packaged desktop at 100% and 150% Qt scale
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'new profile'
          & "$env:PORTABLE_APP\runtime\python.exe" windows\test_sentence_boundaries.py --contract --report visuals\sentence-boundaries.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($scale in '1', '1.5') {
            Write-Host "QT_SCALE_FACTOR=$scale"
            $env:QT_SCALE_FACTOR = $scale
            & "$env:PORTABLE_APP\runtime\python.exe" windows\check.py --desktop -v
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Capture baseline and updated Windows interface
        if: always() && env.PORTABLE_APP != ''
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'wax-visual-baseline'
          git fetch --depth=1 origin $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git worktree add --detach $baseline $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Both source trees use the packaged model files for the same live phrase comparison.
          New-Item -ItemType Junction -Path (Join-Path $baseline 'models') -Target (Join-Path $env:PORTABLE_APP 'models') | Out-Null
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'visual profile'
          foreach ($scale in '1', '1.5') {
            $env:QT_SCALE_FACTOR = $scale
            $python = "$env:PORTABLE_APP\runtime\python.exe"
            & $python windows\capture_visuals.py --source-root $baseline --output "visuals\scale-$scale\before"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $python windows\capture_visuals.py --source-root $env:PORTABLE_APP --output "visuals\scale-$scale\after"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WaxTranslate-Windows-Visuals
          path: visuals
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WaxTranslate-Windows-x64
          path: dist/WaxTranslate-Windows-x64.zip
          compression-level: 0
