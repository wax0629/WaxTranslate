name: Windows multilingual OCR

on:
  pull_request:
    paths:
      - 'windows/reader.py'
      - 'windows/ocr_worker.py'
      - 'windows/install_model.py'
      - 'windows/languages.py'
      - 'windows/test_languages.py'
      - 'windows/testdata/ocr-*.png'
      - '.github/scripts/install-test-ocr.ps1'
      - '.github/workflows/windows-ocr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install the development build and native OCR
        shell: pwsh
        run: |
          $ocr = Start-Job -FilePath "$PWD/.github/scripts/install-test-ocr.ps1"
          try {
            .\windows\setup.cmd
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            .\.venv\Scripts\python.exe windows\install_model.py --all-languages
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Receive-Job -Job $ocr -Wait -ErrorAction Stop
            if ($ocr.State -ne 'Completed') { throw "Native OCR provisioning failed." }
          } finally {
            Remove-Job -Job $ocr -Force
          }
      - name: Recognize and translate real screen samples
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "from winrt.windows.media.ocr import OcrEngine; tags = {l.language_tag.split('-')[0] for l in OcrEngine.available_recognizer_languages}; print('Installed OCR:', sorted(tags)); assert {'ja', 'ko', 'ru'} <= tags"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe windows\check.py -v -k screen_word_and_region
