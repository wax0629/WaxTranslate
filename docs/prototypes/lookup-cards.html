var(--muted);margin:0}.notice{min-height:22px;font-size:11px;color:var(--accent);margin-top:9px}.details{margin-top:12px;padding:12px;background:#f1f2eb;font-size:12px;color:#555b4f;border-radius:5px}.restore{margin:80px 0;background:var(--paper);border:1px solid var(--line);padding:12px 22px;border-radius:7px}.reviewline{font-size:11px;color:var(--muted);margin:18px 0}.contexttoken{border:0;border-bottom:1px dotted #8a8f7e;background:none;padding:0 1px;font:inherit}.contexttoken.selected{font-weight:700;border-bottom-color:var(--accent)}@media(min-width:1100px){.stage{padding-top:28px}}@media(max-width:760px){header{padding:20px;align-items:flex-start}.brand span{display:block;margin:3px 0 0;font-size:10px}main{padding:24px 20px;display:block}nav{grid-template-columns:1fr 1fr;gap:4px}aside p{margin-bottom:16px}.stage{min-height:0;margin-top:15px;padding-bottom:25px}.notes{margin-top:12px}h1{font-size:21px}.card{padding:21px 20px}.subnav{margin-top:17px}.stamp{font-size:10px;max-width:100px}.headword{font-size:32px}.reviewline{margin-bottom:0}}

<main><aside><h1>让解释回到<br>你正在读的地方。</h1><p>四种查询，同一张卡片。<br>选择场景，再试试卡片内的操作。</p><nav id="nav" aria-label="查询场景"></nav><div class="subnav" id="variants" aria-label="场景样例"></div><div class="source" id="source"></div><div class="reviewline">按实际卡片宽度展示，最大 403px。<br>所有收藏与操作仅作用于原型。</div></aside><section><div class="stage" id="stage" aria-live="polite"></div><div class="notes"><h2 id="note-title"></h2><p id="note"></p></div></section></main>

const data={
bank:{word:'bank',variant:'短句',meta:'英语 · 句中解释',meaning:'岸边',origin:'当前句中的词义',original:'They sat on the river <mark>bank</mark> and watched the water.',en:true,translation:'他们坐在河岸边，看着水流。',note:'普通词默认双语。原文与译文对应同一句，只强调这次命中的词。'},

docker:{word:'Docker',variant:'Docker',meta:'技术名称 · 中文语境',meaning:'用于构建、分发和运行容器的平台。',origin:'名称参考',mixed:true,translation:'Deploy Redis with Docker and access the cache through an API.',note:'切换查询只改变命中项及其说明，中文语境保留。不能把整句中的所有英文词统一当作缩写。'},

let group=0,key='bank',expanded=false,contextOpen=false,translated=false,detail=false,saved=false,pinned=false,closed=false;
const $=s=>document.querySelector(s);const icon=(id,label,action)=>`<button class="icon" title="${label}" aria-label="${label}" data-action="${action||id}" ${id==='pin'?`aria-pressed="${pinned}"`:''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg></button>`;
function choose(k){key=k;expanded=false;contextOpen=false;translated=false;detail=false;saved=false;closed=false;render()}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.group!==undefined){group=+b.dataset.group;choose(groups[group][2][0]);return}if(b.dataset.key){choose(b.dataset.key);return}let a=b.dataset.action;if(['context','expand','translate','detail','save','pin','close','restore'].includes(a)){if(a==='context')contextOpen=!contextOpen;if(a==='expand')expanded=!expanded;if(a==='translate')translated=!translated;if(a==='detail')detail=!detail;if(a==='save')saved=!saved;if(a==='pin')pinned=!pinned;if(a==='close')closed=true;if(a==='restore')closed=false;render();return}let n=$('#notice');if(n)n.textContent=({sound:'原型示意：朗读当前词条。','speak-context':'原型示意：朗读当前显示的原文。',copy:'原型示意：复制当前解释，不包含相邻条目。',reference:'原型示意：查看本条解释的来源，不自动搜索整段原文。',recapture:'原型示意：关闭卡片，重新识别鼠标附近文字。'})[a]||'';});render();
